<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison - Hero Section</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* CSS RESET & VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-dark: #292929;
      --color-red: #E74240;
      --color-white: #FFFFFF;
      --font-anton: 'Anton', sans-serif;
      --font-poppins: 'Poppins', sans-serif;
      --desktop-item-height: 68px;
      --mobile-item-height: 36px;
    }

    body {
      font-family: var(--font-poppins);
      color: var(--color-dark);
      background-color: var(--color-white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* MAIN FLUID CONTAINER */
    .hero-section {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: var(--color-white);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* BACKGROUND GRID LINES (Desktop layout scaling) */
    .bg-grid-wrapper {
      position: absolute;
      inset: 0;
      width: 1194px;
      margin: 0 auto;
      pointer-events: none;
      z-index: 1;
      display: flex;
      justify-content: space-between;
    }

    .grid-line {
      width: 1px;
      height: 100%;
      background: rgba(41, 41, 41, 0.15);
    }

    /* HEADER / NAVIGATION */
    .header-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-logo {
      display: flex;
      align-items: center;
    }

    .brand-logo img {
      height: 33px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-chat-header {
      width: 112px;
      height: 45px;
      background: var(--color-red);
      border-radius: 15px;
      border: none;
      color: var(--color-white);
      font-family: var(--font-poppins);
      font-weight: 400;
      font-size: 14px;
      text-transform: capitalize;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .btn-chat-header:hover {
      background-color: #d13432;
    }

    .menu-icon-btn {
      width: 46px;
      height: 45px;
      background: var(--color-red);
      border-radius: 15px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: background-color 0.3s ease;
    }

    .menu-icon-btn:hover {
      background-color: #d13432;
    }

    .menu-icon-btn span {
      display: block;
      height: 3px;
      background-color: var(--color-white);
      border-radius: 4px;
    }

    .menu-icon-btn span:nth-child(1) { width: 20px; }
    .menu-icon-btn span:nth-child(2) { width: 12px; }
    .menu-icon-btn span:nth-child(3) { width: 12px; }

    /* CONTENT WRAPPER */
    .hero-content-wrapper {
      position: relative;
      max-width: 1990px;
      width: 100%;
      height: 700px;
      margin: 0 auto;
      z-index: 5;
    }

    /* LEFT HERO CONTENT */
    .hero-left {
      position: absolute;
      left: 260px;
      top: 50%;
      transform: translateY(-50%);
      width: 925px;
    }

    .hero-title {
      font-family: var(--font-anton);
      font-weight: 400;
      font-size: 200px;
      line-height: 1;
      text-transform: uppercase;
      color: var(--color-dark);
      margin-bottom: 25px;
    }

    .hero-description {
      width: 918px;
      font-family: var(--font-poppins);
      font-weight: 500;
      font-size: 20px;
      line-height: 30px;
      text-transform: capitalize;
      color: var(--color-dark);
      margin-bottom: 40px;
    }

    .hero-left .btn-chat-header {
      margin-left: 0;
    }

    /* RIGHT HERO CONTENT / ROLLING ANIMATION */
    .hero-right {
      position: absolute;
      right: 260px;
      top: 50%;
      transform: translateY(-50%);
      width: 345px;
      height: 340px;
      display: flex;
      align-items: center;
    }

    .static-arrow {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
      width: 40px;
      height: 40px;
      background: var(--color-red);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      z-index: 10;
    }

    .text-viewport {
      position: absolute;
      left: 60px;
      top: 0;
      width: 285px;
      height: calc(var(--desktop-item-height) * 5);
      overflow: hidden;
      background: transparent;
    }

    .text-list {
      display: flex;
      flex-direction: column;
      list-style: none;
      background: transparent;
      will-change: transform;
    }

    .text-item {
      height: var(--desktop-item-height);
      display: flex;
      align-items: center;
      font-family: var(--font-poppins);
      font-weight: 500;
      font-size: 40px;
      line-height: 60px;
      text-transform: capitalize;
      white-space: nowrap;
      color: rgba(41, 41, 41, 0.2);
      background: transparent;
      transition: color 0.5s ease;
    }

    .text-item.active {
      color: var(--color-dark);
    }


    /* ========================================================
       RESPONSIVE MEDIA QUERIES
       ======================================================== */
    @media (max-width: 1600px) {
      .hero-content-wrapper {
        height: auto;
        min-height: 700px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 80px;
      }
      .hero-left {
        position: relative;
        left: 0;
        top: 0;
        transform: none;
        width: 55%;
      }
      .hero-title { font-size: 140px; }
      .hero-description { width: 100%; font-size: 18px; }
      .hero-right {
        position: relative;
        right: 0;
        top: 0;
        transform: none;
      }
      .bg-grid-wrapper { display: none; }
    }

    @media (max-width: 1024px) {
      .header-nav { padding: 30px; }
      .hero-content-wrapper {
        flex-direction: column;
        align-items: flex-start;
        padding: 40px 30px;
        gap: 50px;
      }
      .hero-left { width: 100%; }
      .hero-title { font-size: 100px; }
      .hero-right { width: 100%; justify-content: flex-start; }
    }

    @media (max-width: 768px) {
      .header-nav { padding: 24px; }
      .brand-logo img { height: 26px; }
      .btn-chat-header { display: none; } /* Hidden on mobile per design spec */
      
      .menu-icon-btn {
        width: 46px;
        height: 45px;
      }
      .menu-icon-btn span:nth-child(1) { width: 17px; }
      .menu-icon-btn span:nth-child(2) { width: 9px; }
      .menu-icon-btn span:nth-child(3) { width: 9px; }

      .hero-content-wrapper {
        padding: 20px 24px;
        align-items: center;
        text-align: center;
        gap: 30px;
      }

      .hero-left {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero-title {
        font-size: 80px;
        margin-bottom: 10px;
      }

      .hero-description {
        font-size: 11px;
        line-height: 16px;
        max-width: 320px;
        margin-bottom: 20px;
      }

      .hero-right {
        width: 220px;
        height: 180px;
        margin: 0 auto;
        justify-content: center;
      }

      .static-arrow {
        width: 20px;
        height: 20px;
        left: 0;
      }

      .text-viewport {
        left: 35px;
        width: 160px;
        height: calc(var(--mobile-item-height) * 5);
      }

      .text-item {
        height: var(--mobile-item-height);
        font-size: 20px;
        line-height: 36px;
      }
    }
  </style>
</head>
<body>

  <section class="hero-section">
    
    <!-- BACKGROUND GRID LINES (Desktop layout visual match) -->
    <div class="bg-grid-wrapper">
      <div class="grid-line"></div>
      <div class="grid-line"></div>
      <div class="grid-line"></div>
      <div class="grid-line"></div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="header-nav">
      <div class="brand-logo">
        <img src="morrison.svg" alt="Morrison Logo">
      </div>
      <div class="nav-actions">
        <a href="#chat" class="btn-chat-header">Let’s Chat</a>
        <button class="menu-icon-btn" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <div class="hero-content-wrapper">
      
      <!-- LEFT HERO CONTENT -->
      <div class="hero-left">
        <h1 class="hero-title">Awnings</h1>
        <p class="hero-description">
          designed to enhance the appearance of your storefront while providing practical benefits such as weather protection and increased visibility.
        </p>
        <a href="#chat" class="btn-chat-header">Let’s Chat</a>
      </div>

      <!-- RIGHT HERO CONTENT - ROLLING ANIMATION -->
      <div class="hero-right">
        <div class="static-arrow"></div>
        <div class="text-viewport">
          <ul class="text-list" id="rollingList">
            <li class="text-item">Shop Awnings</li>
            <li class="text-item">Shop Awnings</li>
            <li class="text-item active">Shop Awnings</li>
            <li class="text-item">Shop Awnings</li>
            <li class="text-item">Shop Awnings</li>
          </ul>
        </div>
      </div>

    </div>

  </section>

  <!-- SEAMLESS ROLLING ANIMATION SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.getElementById("rollingList");
      let items = Array.from(list.querySelectorAll(".text-item"));

      function getItemHeight() {
        return items[0].getBoundingClientRect().height;
      }

      function updateActiveClasses() {
        items.forEach((item, index) => {
          if (index === 2) {
            item.classList.add("active");
          } else {
            item.classList.remove("active");
          }
        });
      }

      function rollNext() {
        const itemHeight = getItemHeight();

        // Slide up smoothly every 2 seconds
        list.style.transition = "transform 0.6s cubic-bezier(0.65, 0, 0.35, 1)";
        list.style.transform = `translateY(-${itemHeight}px)`;

        if (items[3]) items[3].classList.add("active");
        if (items[2]) items[2].classList.remove("active");

        setTimeout(() => {
          list.style.transition = "none";
          
          const firstItem = items.shift();
          list.appendChild(firstItem);
          items.push(firstItem);

          list.style.transform = "translateY(0px)";
          updateActiveClasses();
        }, 600);
      }

      updateActiveClasses();
      setInterval(rollNext, 2000);
    });
  </script>

</body>
</html>
