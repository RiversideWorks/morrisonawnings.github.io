<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison - Hero Section</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* CSS RESET & VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-dark: #292929;
      --color-red: #E74240;
      --color-white: #FFFFFF;
      --font-anton: 'Anton', sans-serif;
      --font-poppins: 'Poppins', sans-serif;
      --desktop-item-height: 78px;
      --mobile-item-height: 36px;
    }

    body {
      font-family: var(--font-poppins);
      color: var(--color-dark);
      background-color: var(--color-white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* MAIN CONTAINER (DESKTOP BASE) */
    .hero-container {
      position: relative;
      width: 1990px;
      height: 1072px;
      margin: 0 auto;
      background: var(--color-white);
      overflow: hidden;
    }

    /* GRID LINES (Desktop) */
    .grid-line {
      position: absolute;
      width: 1072px;
      height: 0px;
      top: calc(50% - 536px);
      border: 1px solid rgba(41, 41, 41, 0.15);
      transform: rotate(90deg);
      pointer-events: none;
      z-index: 1;
    }
    .line-18 { left: 398px; }
    .line-19 { left: 796px; }
    .line-20 { left: 1194px; }
    .line-21 { left: 1592px; }

    /* LOGO */
    .brand-logo {
      position: absolute;
      width: 216px;
      height: 33px;
      left: 50px;
      top: 50px;
      z-index: 10;
      display: flex;
      align-items: center;
    }
    .brand-logo img {
      height: 33px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* HEADER BUTTONS (Desktop) */
    .btn-chat-header {
      position: absolute;
      width: 112px;
      height: 45px;
      left: 1762px;
      top: 50px;
      background: var(--color-red);
      border-radius: 15px;
      border: none;
      color: var(--color-white);
      font-family: var(--font-poppins);
      font-weight: 400;
      font-size: 14px;
      line-height: 21px;
      text-transform: capitalize;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 10;
      transition: background-color 0.3s ease;
    }
    .btn-chat-header:hover {
      background-color: #d13432;
    }

    .menu-icon-btn {
      position: absolute;
      width: 46px;
      height: 45px;
      left: 1894px;
      top: 50px;
      background: var(--color-red);
      border-radius: 15px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      z-index: 10;
      transition: background-color 0.3s ease;
    }
    .menu-icon-btn:hover {
      background-color: #d13432;
    }
    .menu-icon-btn span {
      display: block;
      height: 3px;
      background-color: var(--color-white);
      border-radius: 4px;
    }
    .menu-icon-btn span:nth-child(1) { width: 20px; }
    .menu-icon-btn span:nth-child(2) { width: 12px; }
    .menu-icon-btn span:nth-child(3) { width: 12px; }

    /* HERO CONTENT LEFT (Desktop) */
    .hero-title {
      position: absolute;
      width: 671px;
      height: 172px;
      left: 260px;
      top: 356px;
      font-family: var(--font-anton);
      font-weight: 400;
      font-size: 200px;
      line-height: 301px;
      text-transform: uppercase;
      color: var(--color-dark);
      z-index: 5;
    }

    .hero-description {
      position: absolute;
      width: 918px;
      height: 44px;
      left: 267px;
      top: 578px;
      font-family: var(--font-poppins);
      font-weight: 500;
      font-size: 20px;
      line-height: 30px;
      text-transform: capitalize;
      color: var(--color-dark);
      z-index: 5;
    }

    .hero-btn-bottom {
      position: absolute;
      width: 112px;
      height: 45px;
      left: 267px;
      top: 672px;
      background: var(--color-red);
      border-radius: 15px;
      border: none;
      color: var(--color-white);
      font-family: var(--font-poppins);
      font-weight: 400;
      font-size: 14px;
      line-height: 21px;
      text-transform: capitalize;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 5;
      transition: background-color 0.3s ease;
    }
    .hero-btn-bottom:hover {
      background-color: #d13432;
    }

    /* HERO CONTENT RIGHT / ROLLING ANIMATION (Desktop) */
    .hero-right {
      position: absolute;
      width: 345px;
      height: 340px;
      left: 1385px;
      top: calc(50% - 340px / 2);
      z-index: 5;
      display: flex;
      align-items: center;
    }

    .static-arrow {
      position: absolute;
      width: 40px;
      height: 40px;
      left: 0px;
      top: calc(50% - 40px / 2);
      background: var(--color-red);
      transform: rotate(90deg);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      z-index: 10;
    }

    .text-viewport {
      position: absolute;
      left: 60px;
      top: 0;
      width: 285px;
      height: calc(var(--desktop-item-height) * 5);
      overflow: hidden;
      background: transparent;
    }

    .text-list {
      display: flex;
      flex-direction: column;
      list-style: none;
      background: transparent;
      will-change: transform;
    }

    .text-item {
      height: var(--desktop-item-height);
      display: flex;
      align-items: center;
      font-family: var(--font-poppins);
      font-weight: 500;
      font-size: 40px;
      line-height: 60px;
      text-transform: capitalize;
      white-space: nowrap;
      color: rgba(41, 41, 41, 0.2);
      background: transparent;
      transition: color 0.5s ease;
    }

    .text-item.active {
      color: var(--color-dark);
    }


    /* ========================================================
       MOBILE MEDIA QUERY (Matches iPhone 16/17 Pro Max design specs)
       ======================================================== */
    @media (max-width: 768px) {
      .hero-container {
        width: 100%;
        max-width: 440px;
        height: 956px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }

      /* Hide Desktop Grid Lines */
      .grid-line {
        display: none;
      }

      /* Mobile Logo */
      .brand-logo {
        width: 216px;
        height: 33px;
        left: 30px;
        top: 36px;
      }

      /* Mobile Header Buttons */
      .btn-chat-header {
        display: none; /* Mobile design relies on top right hamburger menu */
      }

      .menu-icon-btn {
        width: 46px;
        height: 45px;
        left: 364px;
        top: 30px;
      }
      .menu-icon-btn span:nth-child(1) { width: 17px; }
      .menu-icon-btn span:nth-child(2) { width: 9px; }
      .menu-icon-btn span:nth-child(3) { width: 9px; }

      /* Mobile Hero Title ("Awnings") */
      .hero-title {
        width: 336px;
        height: 86px;
        left: 50%;
        transform: translateX(-50%);
        top: 175px;
        font-size: 100px;
        line-height: 151px;
        text-align: left;
      }

      /* Mobile Description */
      .hero-description {
        width: 380px;
        height: 22px;
        left: 50%;
        transform: translateX(-50%);
        top: 292px;
        font-size: 10px;
        line-height: 15px;
        text-align: center;
      }

      /* Hide Bottom Chat Button on Mobile if not in design spec */
      .hero-btn-bottom {
        display: none;
      }

      /* Mobile Hero Right / Rolling Animation */
      .hero-right {
        position: absolute;
        width: 183px;
        height: 156px;
        left: 50%;
        transform: translateX(-50%);
        top: calc(50% - 156px / 2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .static-arrow {
        width: 20px;
        height: 20px;
        left: 0px;
        top: calc(50% - 20px / 2);
      }

      .text-viewport {
        position: absolute;
        left: 40px;
        top: 0;
        width: 143px;
        height: calc(var(--mobile-item-height) * 5);
      }

      .text-item {
        height: var(--mobile-item-height);
        font-size: 20px;
        line-height: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    
    <!-- BACKGROUND GRID LINES (Desktop) -->
    <div class="grid-line line-18"></div>
    <div class="grid-line line-19"></div>
    <div class="grid-line line-20"></div>
    <div class="grid-line line-21"></div>

    <!-- HEADER / NAVIGATION -->
    <div class="brand-logo">
      <img src="morrison.svg" alt="Morrison Logo">
    </div>

    <a href="#chat" class="btn-chat-header">Let’s Chat</a>
    
    <button class="menu-icon-btn" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- LEFT HERO CONTENT -->
    <h1 class="hero-title">Awnings</h1>
    <p class="hero-description">
      designed to enhance the appearance of your storefront while providing practical benefits.
    </p>
    <a href="#chat" class="hero-btn-bottom">Let’s Chat</a>

    <!-- RIGHT HERO CONTENT - ROLLING ANIMATION -->
    <div class="hero-right">
      <div class="static-arrow"></div>
      <div class="text-viewport">
        <ul class="text-list" id="rollingList">
          <li class="text-item">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
          <li class="text-item active">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
        </ul>
      </div>
    </div>

  </div>

  <!-- SEAMLESS ROLLING ANIMATION SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.getElementById("rollingList");
      let items = Array.from(list.querySelectorAll(".text-item"));

      function getItemHeight() {
        return items[0].getBoundingClientRect().height;
      }

      function updateActiveClasses() {
        items.forEach((item, index) => {
          if (index === 2) {
            item.classList.add("active");
          } else {
            item.classList.remove("active");
          }
        });
      }

      function rollNext() {
        const itemHeight = getItemHeight();

        // Slide up smoothly every 2 seconds
        list.style.transition = "transform 0.6s cubic-bezier(0.65, 0, 0.35, 1)";
        list.style.transform = `translateY(-${itemHeight}px)`;

        if (items[3]) items[3].classList.add("active");
        if (items[2]) items[2].classList.remove("active");

        setTimeout(() => {
          list.style.transition = "none";
          
          const firstItem = items.shift();
          list.appendChild(firstItem);
          items.push(firstItem);

          list.style.transform = "translateY(0px)";
          updateActiveClasses();
        }, 600);
      }

      updateActiveClasses();
      setInterval(rollNext, 2000);
    });
  </script>

</body>
</html>
