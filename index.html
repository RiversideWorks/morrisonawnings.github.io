<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrison - Hero Section</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS RESET & VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-dark: #292929;
      --color-red: #E74240;
      --color-white: #FFFFFF;
      --font-anton: 'Anton', sans-serif;
      --font-poppins: 'Poppins', sans-serif;
      --item-height: 64px; /* Default height for item alignment */
    }

    body {
      font-family: var(--font-poppins);
      color: var(--color-dark);
      background-color: var(--color-white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER / NAVBAR */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 80px;
      width: 100%;
    }

    .brand-logo {
      font-family: 'Playfair Display', serif, var(--font-poppins);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-dark);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-red {
      background-color: var(--color-red);
      color: var(--color-white);
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-family: var(--font-poppins);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: inline-block;
      transition: background-color 0.3s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-red:hover {
      background-color: #d13432;
      transform: translateY(-1px);
    }

    /* HAMBURGER MENU - 3 lines (short top & bottom, longer middle, rounded edges) */
    .menu-icon-btn {
      width: 44px;
      height: 44px;
      background-color: var(--color-red);
      border-radius: 50%;
      border: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .menu-icon-btn:hover {
      background-color: #d13432;
    }

    .menu-icon-btn span {
      display: block;
      height: 2.5px;
      background-color: var(--color-white);
      border-radius: 4px;
    }

    .menu-icon-btn span:nth-child(1),
    .menu-icon-btn span:nth-child(3) {
      width: 12px;
    }

    .menu-icon-btn span:nth-child(2) {
      width: 18px;
    }

    /* HERO CONTAINER */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 80px 80px 80px;
      min-height: calc(100vh - 120px);
      gap: 60px;
      background: transparent;
    }

    /* LEFT CONTENT */
    .hero-left {
      max-width: 550px;
      flex: 1;
    }

    .hero-title {
      font-family: var(--font-anton);
      font-size: 160px;
      line-height: 0.9;
      color: var(--color-dark);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .hero-description {
      font-family: var(--font-poppins);
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-dark);
      font-weight: 500;
      margin-bottom: 36px;
      max-width: 480px;
    }

    /* RIGHT CONTENT - ROLLING TEXT */
    .hero-right {
      position: relative;
      display: flex;
      align-items: center;
      padding-left: 45px;
      background: transparent;
      flex: 1;
      justify-content: flex-start;
    }

    /* STATIC RED ARROW */
    .static-arrow {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 18px solid var(--color-red);
      z-index: 10;
    }

    /* VIEWPORT - Clean blend, no background box effect */
    .text-viewport {
      height: calc(var(--item-height) * 5); /* 5 items visible */
      overflow: hidden;
      position: relative;
      background: transparent;
    }

    .text-list {
      display: flex;
      flex-direction: column;
      list-style: none;
      background: transparent;
      will-change: transform;
    }

    .text-item {
      height: var(--item-height);
      display: flex;
      align-items: center;
      font-family: var(--font-poppins);
      font-size: 40px;
      font-weight: 500;
      white-space: nowrap;
      color: var(--color-dark);
      background: transparent;
      transition: opacity 0.5s ease, filter 0.5s ease, font-weight 0.5s ease;
      opacity: 0.25;
      filter: blur(2px);
    }

    /* Active focused center line */
    .text-item.active {
      opacity: 1;
      filter: blur(0px);
      font-weight: 600;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 1200px) {
      .header, .hero { padding: 30px 50px; }
      .hero-title { font-size: 130px; }
      :root { --item-height: 56px; }
      .text-item { font-size: 34px; }
    }

    @media (max-width: 992px) {
      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 50px;
        padding-top: 20px;
      }
      .hero-title { font-size: 110px; }
      .hero-left, .hero-right { max-width: 100%; width: 100%; }
      .hero-right { padding-left: 40px; }
    }

    @media (max-width: 768px) {
      .header { padding: 20px 24px; }
      .hero { padding: 20px 24px 60px 24px; }
      .hero-title { font-size: 80px; margin-bottom: 20px; }
      .hero-description { font-size: 14px; margin-bottom: 28px; }
      :root { --item-height: 48px; }
      .text-item { font-size: 26px; }
      .static-arrow {
        border-top-width: 8px;
        border-bottom-width: 8px;
        border-left-width: 14px;
      }
    }

    @media (max-width: 480px) {
      .brand-logo { font-size: 22px; }
      .btn-red { padding: 10px 20px; font-size: 13px; }
      .hero-title { font-size: 64px; }
      :root { --item-height: 42px; }
      .text-item { font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="header">
    <div class="brand-logo">MORRISON</div>
    <div class="nav-actions">
      <a href="#chat" class="btn-red">Let's Chat</a>
      <button class="menu-icon-btn" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <!-- LEFT CONTENT -->
    <div class="hero-left">
      <h1 class="hero-title">AWNINGS</h1>
      <p class="hero-description">
        Designed To Enhance The Appearance Of Your Storefront While Providing Practical Benefits Such As Weather Protection And Increased Visibility.
      </p>
      <a href="#chat" class="btn-red">Let's Chat</a>
    </div>

    <!-- RIGHT CONTENT ANIMATION -->
    <div class="hero-right">
      <div class="static-arrow"></div>
      <div class="text-viewport">
        <ul class="text-list" id="rollingList">
          <li class="text-item">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
          <li class="text-item active">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
          <li class="text-item">Shop Awnings</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- SEAMLESS ROLLING ANIMATION SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.getElementById("rollingList");
      let items = Array.from(list.querySelectorAll(".text-item"));
      
      // Dynamic item height recalculation for full responsiveness
      function getItemHeight() {
        return items[0].getBoundingClientRect().height;
      }

      function updateActiveClasses() {
        items.forEach((item, index) => {
          if (index === 2) {
            item.classList.add("active");
          } else {
            item.classList.remove("active");
          }
        });
      }

      function rollNext() {
        const itemHeight = getItemHeight();
        
        // Smooth transition slide up by 1 item height
        list.style.transition = "transform 0.5s cubic-bezier(0.65, 0, 0.35, 1)";
        list.style.transform = `translateY(-${itemHeight}px)`;

        // Update active blur state mid-animation for realism
        if (items[3]) items[3].classList.add("active");
        if (items[2]) items[2].classList.remove("active");

        // After slide completes, reorganize DOM without transition (Zero glitch infinite loop)
        setTimeout(() => {
          list.style.transition = "none";
          
          // Move top item to bottom
          const firstItem = items.shift();
          list.appendChild(firstItem);
          items.push(firstItem);

          // Reset offset instantly
          list.style.transform = "translateY(0px)";
          
          // Re-apply correct active class for position 3 (index 2)
          updateActiveClasses();
        }, 500);
      }

      // Initial active state setup
      updateActiveClasses();

      // Scroll interval set to every 2 seconds
      setInterval(rollNext, 2000);
    });
  </script>

</body>
</html>
